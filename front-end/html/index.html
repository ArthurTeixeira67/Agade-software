<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Agadê Software</title>
</head>
<body>
    <h1 class="title">Agadê Software</h1>

    <form class="formulario" action="">

        <div class="inf">
            <label for="id_base">id_base:</label>
            <input type="number" id="id_base">

            <label for="nome">nome:</label>
            <input type="text" id="nome">

            <label for="descricao">descricao:</label>
            <textarea id="descricao" cols="30" rows="5"></textarea>

            <label for="tabela_destino">tabela_destino:</label>
            <input type="text" id="tabela_destino">

            <label for="fonte_link">fonte_link:</label>
            <input type="text" id="fonte_link">

            <label for="fonte_api">fonte_api:</label>
            <input type="text" id="fonte_api">
        </div>

        <div class="list">
            <label for="url">URL:</label>
            <div>
                <input type="text" id="url">
                <button class="btn">Listar package's</button>
            </div>

            <!--Listar packages e resources-->

            <input type="submit" value="Criar bases e fontes" class="btn">
        </div>
    </form>

</body>
</html>
